<!DOCTYPE html>
<html>
    <head>
        <title>apple.com</title>

        <link rel="stylesheet" href="./css/apple.css">

        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
              integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
              crossorigin="anonymous"
              referrerpolicy="no-referrer">

        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=work">
    </head>

    <body>

        <div class="nav">

            <div class="name">
                Education Store Home

                <div class="name1">
                    | Exit
                </div>
            </div>

        </div>


        <div class="apple">

            <i class="fa-brands fa-apple"></i>

            <div class="services">

                <ul>
                    <li>Store</li>
                    <li>Mac</li>
                    <li>iPad</li>
                    <li>iPhone</li>
                    <li>Watch</li>
                    <li>Vision</li>
                    <li>AirPods</li>
                    <li>TV & Home</li>
                    <li>Entertainment</li>
                    <li>Accessories</li>
                    <li>Support</li>
                </ul>

            </div>


            <div class="search">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
            </div>


            <div class="work">
                <span class="material-symbols-outlined work-bag">
                    work
                </span>
            </div>

        </div>


        <div class="banner">

            <div class="banner1">
                Surprise and shine.
            </div>

            <div class="banner2">
                Watch a special Apple Event online on 9/9 at 10 a.m. PT.
            </div>

            <div class="banner3">
                <button class="banner4">
                    Add to Calendar
                </button>
            </div>

        </div>

    </body>
</html>
